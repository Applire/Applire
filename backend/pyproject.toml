[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "applire"
version = "0.37.2-beta"
requires-python = ">=3.12"
# Dependencies are declared in requirements.txt and installed separately.
# This file exists solely to make `pip install -e .` work for Cloud's dev workflow (ADR-031).
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["applire*"]
# `applire` is a PEP 420 namespace package (no top-level __init__.py) so Cloud's
# `applire.cloud.*` can attach in a second editable-install root (ADR-031, amended 2026-06-03).
namespaces = true
