# Compose install guard (#126): the shipped docker-compose.yml must pull clean.
#
# The v0.37.1-beta blind install test found ghcr.io/applire/applire-nginx:latest
# had never been published — the README's 4-command self-host install died at
# `docker compose pull` for every new self-hoster while every internal stack
# (dev override, edge) kept working. This guard checks, from a clean context,
# exactly what the README advertises.
#
# 2026-08-30: the README's install path moved from raw-on-main to the newest
# release's ASSETS (github.com/.../releases/latest/download/...), so that the
# compose file, the env template and the `:latest` images are one matching set —
# GitHub's `releases/latest` and Docker's `:latest` move on the same publish, by
# the same `prerelease == false` predicate. This guard follows that move: it now
# fetches what a self-hoster actually gets, which also proves the assets exist. A
# release published without them 404s the documented install for everyone.
#
# Runs: after every release publish (called from release.yml), weekly (drift on
# registries/typos/missing assets), on any main push touching the compose or the
# env template, and on demand.
#
# 2026-09-08 (ADR-032 amended, founder ruling F13 / JF-O-1.3): release.yml now
# calls this workflow TWICE. Once as an assets GATE, before the jobs that move
# the `:latest` tag (`assets_only: true`) — v0.41.1-beta was published without
# its two assets, this guard fired, and it fired only after `:latest` had already
# moved, so for hours `:latest` pointed at a release whose documented install
# 404ed. `releases/latest` and Docker's `:latest` move on the SAME publish by the
# same `prerelease == false` predicate, so at the moment the `released` event
# fires the assets either exist or the install is already broken — the check can
# therefore run BEFORE the tag rather than after it. And once afterwards, in full,
# where the image-manifest sweep can see the images this release just published.
#
# The two inputs are shaped so that an UNSET input (schedule, push, dispatch —
# where `inputs.*` is empty and therefore falsy) means "do everything, and fail
# on a problem". A weakening must be asked for explicitly; it can never be the
# default that a caller forgot to override.

name: Compose install guard

on:
  workflow_call:
    inputs:
      assets_only:
        description: >-
          Fetch the release assets and stop — skip the drift report and the
          image-manifest sweep. Used by the pre-tag gate, where the new images
          do not exist yet.
        type: boolean
        default: false
      advisory:
        description: >-
          Report a missing asset instead of failing. Set by the pre-tag gate for
          events that do NOT move `:latest` (a pre-release publish, a manual
          dispatch), where `releases/latest` describes some earlier release and
          blocking on it would punish the wrong build.
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - .env.example

jobs:
  verify-shipped-compose:
    name: The documented install fetches and resolves
    runs-on: ubuntu-latest
    env:
      RELEASE_DL: https://github.com/Applire/Applire/releases/latest/download
      ADVISORY: ${{ inputs.advisory && 'true' || 'false' }}
    steps:
      - name: Fetch the files a self-hoster gets (newest release's assets)
        run: |
          set -euo pipefail
          missing=0
          if ! curl -fsSL "$RELEASE_DL/docker-compose.yml" -o compose-shipped.yml; then
            echo "::error::$RELEASE_DL/docker-compose.yml does not resolve — the newest"
            echo "::error::release has no docker-compose.yml asset, so the README's install"
            echo "::error::path is 404 for every self-hoster. Attach it to the Release."
            missing=1
          fi
          if ! curl -fsSL "$RELEASE_DL/env.example" -o env.example.shipped; then
            echo "::error::$RELEASE_DL/env.example does not resolve — the newest release"
            echo "::error::has no env.example asset. Attach it to the Release."
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "Fetched both install assets from the newest published release."
          elif [ "$ADVISORY" = "true" ]; then
            echo "::warning::Install assets are missing from the newest release, but this"
            echo "::warning::event does not move :latest — reporting instead of blocking."
          else
            exit 1
          fi

      - name: Report drift between main and the shipped release (informational)
        if: ${{ !inputs.assets_only }}
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/Applire/Applire/main/docker-compose.yml -o compose-main.yml || exit 0
          curl -fsSL https://raw.githubusercontent.com/Applire/Applire/main/.env.example -o env.main || exit 0
          for pair in "compose-shipped.yml:compose-main.yml:docker-compose.yml" "env.example.shipped:env.main:.env.example"; do
            IFS=: read -r shipped current label <<< "$pair"
            if ! diff -q "$shipped" "$current" >/dev/null 2>&1; then
              echo "::notice::$label differs between main and the newest release —"
              echo "::notice::self-hosters are running the released version. Expected"
              echo "::notice::mid-flavour; it must not survive the next release."
              diff -u "$shipped" "$current" || true
            fi
          done

      - name: Verify every image manifest resolves
        if: ${{ !inputs.assets_only }}
        run: |
          set -euo pipefail
          mapfile -t images < <(
            grep -E '^[[:space:]]*image:' compose-shipped.yml \
              | awk '{print $2}' | sort -u
          )
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::No image references found in the shipped compose — extraction broken or file moved"
            exit 1
          fi
          echo "Checking ${#images[@]} image references:"
          fail=0
          for ref in "${images[@]}"; do
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "OK    $ref"
            else
              echo "::error::$ref does not resolve on its registry — the advertised install (docker compose pull) is broken for self-hosters"
              fail=1
            fi
          done
          exit "$fail"
