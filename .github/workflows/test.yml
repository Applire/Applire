name: Test Suite

on:
  push:
    branches: [main]      # post-merge / direct commits to main
  pull_request:           # every PR (feature branches)

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock requests

      - name: Install Playwright Chromium (ATS round-trip renderer)
        run: python -m playwright install --with-deps chromium

      # poppler-utils supplies `pdftotext -bbox-layout`, the word-level geometry
      # probe tests/ats/test_page_geometry.py measures #621's page margins and
      # #622's break policy with. Without it those 45 tests error out (the binary
      # is absent on ubuntu-latest by default) — and a skip would be worse than a
      # failure: the whole point of the suite is that the layout claims are backed
      # by read pixels, not by reasoning about CSS.
      - name: Install poppler-utils (PDF geometry probe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      # tests/ats/test_office_export.py (E057 task 1.3, #637/#638, ADR-079
      # clause 5) converts the .docx office-export writer's output to PDF
      # with headless LibreOffice to assert the page count — a .docx has no
      # fixed pagination of its own until a word processor lays it out
      # (ADR-079 clause 4). Absent from ubuntu-latest by default, like
      # poppler-utils above, and for the same reason a skip would be worse
      # than a failure here too: the whole point of the gate is that "fits
      # the region's page norm" is backed by a real conversion, not a guess.
      # fonts-crosextra-carlito is the metric-compatible substitute Ubuntu
      # ships for Calibri (services/office_export/_common.py's base font) —
      # installing it PINS which substitution this runner's LibreOffice
      # makes, so the flip point measured on the dev host
      # (Documents/Runs/Stracciatella/office-export/2026-08-31-page-count-
      # gate-portability.md: 1->2 pages at 39 bullets on this exact
      # substitution, the tightest of three fonts measured) reproduces here
      # instead of being asserted across whatever font happens to be
      # present.
      - name: Install LibreOffice + metric-compatible fonts (docx page-count gate)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-crosextra-carlito

      - name: ATS round-trip guarantee (ADR-039)
        env:
          # No database is touched; the name still ends in `_test` like every
          # test URL (NoAuth harness fence, ADR-091 cl. 3 (c)).
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/ats_test
        run: PYTHONPATH=backend pytest tests/ats/ -v

      - name: Run unit tests with coverage
        run: |
          PYTHONPATH=backend pytest tests/unit/ backend/tests/unit/ \
            --ignore=tests/conftest.py \
            --ignore=backend/tests/conftest.py \
            --cov=applire \
            --cov-config=backend/.coveragerc \
            --cov-report=term-missing \
            --cov-report=html:backend/htmlcov \
            --cov-fail-under=75 \
            --junitxml=backend/test-results.xml \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/htmlcov/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: backend/test-results.xml
          retention-days: 30

      - name: Publish unit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Unit Tests
          path: backend/test-results.xml
          reporter: 'java-junit'
          fail-on-error: false

  integration-and-e2e-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghclient /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock requests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Both lockfiles: this job runs `npm ci` twice (root, then frontend) and
          # the key covered only the frontend one, so a root-lockfile change
          # silently missed. Measured 2026-09-04: a cold `npm ci` costs 7.0 min in
          # a job with ~8 min of headroom.
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        run: node_modules/.bin/playwright install --with-deps chromium firefox

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The step that used to sit here cached /tmp/.buildx-cache — a path that
      # appeared exactly ONCE in the whole repository, in the cache step itself.
      # Nothing wrote to it and `docker compose up --build` never read it, so the
      # image build was cold on EVERY run: a control that could not fire. Measured
      # 2026-09-04 on a job with `timeout-minutes: 30` and ~8 min of headroom, the
      # build cost 2.9-8.6 min depending on the runner, and three consecutive runs
      # timed out during PQ with no test having failed. Replaced with a cache that
      # is actually wired to the build, via BuildKit's GitHub Actions backend.
      #
      # `docker-compose.override.yml` builds two images (backend -- shared by the
      # backend/retention/mcp services -- and frontend). They are built here with
      # the tags docker-compose.yml declares, so the `up` below finds them locally
      # and does not rebuild; `--build` is therefore dropped.
      - name: Build backend image (layer-cached)
        uses: docker/build-push-action@v6
        # docker/build-push-action uploads a `.dockerbuild` build-record artifact
        # by default. The Test Summary job downloads ALL artifacts of the run, so
        # two extra ones broke its download step (8 found instead of 6) while every
        # test passed — a green suite reported red by its own aggregator. We do not
        # consume build records; turn them off rather than teach the summary to
        # filter, so the artifact set stays exactly what the tests produce.
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./backend
          tags: ghcr.io/applire/applire-backend:latest
          load: true
          cache-from: type=gha,scope=e2e-backend
          cache-to: type=gha,mode=max,scope=e2e-backend

      - name: Build frontend image (layer-cached)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./frontend
          # `target: dev` mirrors docker-compose.override.yml exactly — the
          # frontend Dockerfile is multi-stage and the dev stack expects the dev
          # stage (hot reload, the /app/node_modules and /app/.next volumes).
          # Building the default/production stage here would start a subtly wrong
          # frontend and the E2E suites would chase the symptom, not the cause.
          target: dev
          tags: ghcr.io/applire/applire-frontend:latest
          load: true
          cache-from: type=gha,scope=e2e-frontend
          cache-to: type=gha,mode=max,scope=e2e-frontend

      # .env.ci puts this stack on the fenced NoAuth test harness (ADR-091 cl. 3):
      # AUTH_HARNESS=true on the database `applire_ci` (POSTGRES_DB, which the
      # compose file interpolates into every DATABASE_URL). The harness serves
      # only a _ci/_test database that held no profile at boot, so this lane
      # proves behaviour, not access control — that is the real-auth lane below.
      # The MCP stdio tier starts a new process per test after profiles exist;
      # it relies on the stdio process skipping the profile-count latch (MD-26).
      - name: Create .env from CI template
        run: cp .env.ci .env

      - name: Start Docker services
        run: docker compose up -d

      - name: Wait for application to be ready
        run: |
          echo "Waiting for backend..."
          timeout 300 bash -c 'until curl -sf http://localhost:8001/health; do sleep 3; done'
          echo "Backend ready."
          echo "Waiting for frontend..."
          timeout 180 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'
          echo "Frontend ready."
          echo "Waiting for nginx (PQ tests require port 80)..."
          timeout 60 bash -c 'until curl -sf http://localhost; do sleep 2; done'
          echo "Nginx ready."

      - name: Show backend logs on startup failure
        if: failure()
        run: docker compose logs backend postgres

      - name: Run database migrations
        run: docker compose exec backend python -m alembic upgrade head

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --junitxml=integration-test-results.xml \
            -v \
            --tb=short

      - name: Run MCP stdio tests (agent channel)
        run: |
          pytest tests/test_mcp_server.py tests/test_mcp_endpoints.py tests/test_mcp_agent_journey.py \
            --junitxml=mcp-test-results.xml \
            -v \
            --tb=short

      - name: Upload MCP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-stdio-test-results
          path: mcp-test-results.xml
          retention-days: 30

      - name: Run Playwright IQ tests
        run: node_modules/.bin/playwright test tests/iq/
        env:
          CI: true

      - name: Run Playwright OQ tests (desktop)
        run: node_modules/.bin/playwright test tests/oq/ --project=chromium
        env:
          CI: true

      - name: Run Playwright OQ tests (mobile, US227)
        run: node_modules/.bin/playwright test tests/oq/mobile/ --project=mobile-chromium
        env:
          CI: true

      - name: Run Playwright PQ tests
        run: node_modules/.bin/playwright test --config=playwright.config.pq.ts
        env:
          CI: true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-results
          path: integration-test-results.xml
          retention-days: 30

      - name: Publish integration test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Integration Tests
          path: integration-test-results.xml
          reporter: 'java-junit'
          fail-on-error: false

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 30

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down Docker services
        if: always()
        run: docker compose down -v

  # Postgres-only proofs (row locks, plpgsql triggers, enforced FKs, the full
  # alembic chain with pgvector) — SQLite cannot show them, so these files skip
  # in every other job. Each file DROPS/rewrites its database, so each gets its
  # own throwaway `*_test` database, and runs with --noconftest (the root
  # tests/conftest.py would start the compose stack). Two env names exist for
  # historical reasons (APPLIRE_PG_TEST_URL, APPLIRE_TEST_PG_URL); both are set.
  # A SKIP here is a failure: a lane that skips proves nothing (#438).
  postgres-only-tests:
    name: Postgres-only Tests (races, constraints, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_BASE: postgresql+asyncpg://postgres:proof@127.0.0.1:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Create one throwaway database per file
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect("postgresql://postgres:proof@127.0.0.1:5432/postgres")
              for db in ("ownership_test", "erasure_test", "links_test", "accounts_test", "races_test"):
                  await conn.execute(f'CREATE DATABASE "{db}"')
              await conn.close()
          asyncio.run(main())
          PY

      - name: Run the Postgres-only tests
        run: |
          set -euo pipefail
          pg_file() {
            local db="$1"; shift
            local url="$PG_BASE/$db"
            local log; log="$(mktemp)"
            APPLIRE_PG_TEST_URL="$url" APPLIRE_TEST_PG_URL="$url" DATABASE_URL="$url" \
              LLM_PROVIDER=mistral PYTHONPATH=backend \
              python -m pytest "$@" --noconftest -q -rs -p no:cacheprovider 2>&1 | tee "$log"
            if grep -qE "[0-9]+ skipped" "$log"; then
              echo "::error::PG lane: a Postgres-only test SKIPPED against $db — the lane proves nothing for it"
              exit 1
            fi
          }
          pg_file ownership_test tests/integration/test_ownership_constraints.py
          pg_file erasure_test   tests/integration/test_erasure_race_pg.py
          pg_file links_test     tests/integration/test_migration_0076_links.py
          pg_file accounts_test  tests/integration/test_admin_accounts_pg.py
          # test_auth_pg_races.py expects a migrated database (it does not migrate).
          ( cd backend && DATABASE_URL="$PG_BASE/races_test" LLM_PROVIDER=mistral python -m alembic upgrade head )
          pg_file races_test     tests/unit/test_auth_pg_races.py

  # Real-auth lane (ADR-091 D-1; arc42 §8.10): the production topology with login
  # ON — no AUTH_HARNESS — and nginx on a NON-80 port (8091), where the
  # Host/Origin port class of bug is visible (nginx `Host $host` dropped the
  # port and refused every login on a remapped port). docker-compose.ci-auth.yml
  # + .env.ci-auth. The smoke below claims the instance the way an operator does
  # (setup code from the backend log); tests/test_auth_e2e.py (package 5b) runs
  # on the same stack when it exists, signed in by the `auth_session` fixture.
  real-auth-lane:
    name: Real-auth Lane (login on, nginx on :8091)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI_AUTH_BASE: http://localhost:8091
      CI_AUTH_COMPOSE: docker compose -p applire-ci-auth -f docker-compose.yml -f docker-compose.ci-auth.yml
      APPLIRE_E2E_ADMIN_EMAIL: admin@ci-auth.example.org
      APPLIRE_E2E_ADMIN_PASSWORD: ci-auth lane admin passphrase

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghclient /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built under the names docker-compose.ci-auth.yml declares, then `up
      # --no-build` uses them (a compose build would not see the gha cache).
      - name: Build backend image (layer-cached)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./backend
          tags: applire-backend:ci-auth
          load: true
          cache-from: type=gha,scope=ci-auth-backend
          cache-to: type=gha,mode=max,scope=ci-auth-backend

      - name: Build frontend image (production stage, layer-cached)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./frontend
          target: runner
          tags: applire-frontend:ci-auth
          load: true
          cache-from: type=gha,scope=ci-auth-frontend
          cache-to: type=gha,mode=max,scope=ci-auth-frontend

      - name: Build nginx image (this tree's self-hosted.conf)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./nginx
          tags: applire-nginx:ci-auth
          load: true

      - name: Start the real-auth stack
        run: $CI_AUTH_COMPOSE up -d --no-build

      - name: Real-auth smoke (setup through nginx on :8091, gated ops health, harness refusal)
        run: |
          set -euo pipefail
          B="$CI_AUTH_BASE"
          timeout 300 bash -c "until curl -sf $B/health >/dev/null; do sleep 3; done"
          echo "== /health is liveness only (S-16, RD-1)"
          curl -sf "$B/health" | jq -e 'keys == ["edition","status","version"]'
          echo "== /api/ops/health needs an admin or a probe token"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/api/ops/health")" = 401
          echo "== fresh instance: setup required, no harness"
          curl -sf "$B/api/auth/state" | jq -e '.setup_required == true and .harness == false'
          CODE="$($CI_AUTH_COMPOSE logs --no-color backend | grep -oE 'enter: [A-Z2-7]{4}(-[A-Z2-7]{4})+' | tail -1 | cut -d' ' -f2)"
          test -n "$CODE"
          BODY="$(jq -cn --arg c "$CODE" --arg e "$APPLIRE_E2E_ADMIN_EMAIL" --arg p "$APPLIRE_E2E_ADMIN_PASSWORD" '{setup_token:$c,email:$e,password:$p}')"
          echo "== an Origin without the port is refused (the \$host bug class)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: http://localhost' -H 'Content-Type: application/json' -d "$BODY" "$B/api/setup")" = 403
          echo "== setup through nginx with the browser's Origin (host AND port)"
          JAR="$(mktemp)"
          test "$(curl -s -c "$JAR" -o /dev/null -w '%{http_code}' -H "Origin: $B" -H 'Content-Type: application/json' -d "$BODY" "$B/api/setup")" = 204
          curl -sf -b "$JAR" "$B/api/auth/me" | jq -e '.role == "admin"'
          test "$(curl -s -b "$JAR" -o /dev/null -w '%{http_code}' "$B/api/ops/health")" = 200
          echo "== logout, then login again"
          test "$(curl -s -b "$JAR" -o /dev/null -w '%{http_code}' -X POST -H "Origin: $B" "$B/api/auth/logout")" = 204
          LOGIN="$(jq -cn --arg e "$APPLIRE_E2E_ADMIN_EMAIL" --arg p "$APPLIRE_E2E_ADMIN_PASSWORD" '{email:$e,password:$p}')"
          test "$(curl -s -c "$JAR" -o /dev/null -w '%{http_code}' -H "Origin: $B" -H 'Content-Type: application/json' -d "$LOGIN" "$B/api/auth/login")" = 204
          curl -sf -b "$JAR" "$B/api/auth/me" | jq -e '.role == "admin"'
          echo "== access logs carry no query strings (signed-link sig)"
          curl -s -o /dev/null "$B/api/cv/00000000-0000-0000-0000-00000000abcd/pdf?exp=1&uid=x&sig=CISECRETSIG"
          sleep 1
          if $CI_AUTH_COMPOSE logs --no-color nginx backend | grep -q CISECRETSIG; then
            echo "::error::a signed-link sig reached the access log"; exit 1
          fi
          echo "== the NoAuth harness refuses a non-test database (exit 1)"
          set +e
          HLOG="${RUNNER_TEMP:-/tmp}/harness.log"
          $CI_AUTH_COMPOSE run --rm --no-deps -T -e AUTH_HARNESS=true backend > "$HLOG" 2>&1
          rc=$?
          set -e
          tail -5 "$HLOG"
          test "$rc" = 1
          grep -q "AUTH_HARNESS refused" "$HLOG"

      - name: Set up Python 3.12.3 (real-auth tests)
        if: hashFiles('tests/test_auth_e2e.py') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Run real-auth tests (package 5b)
        if: hashFiles('tests/test_auth_e2e.py') != ''
        env:
          APPLIRE_E2E_AUTH: "1"
          APPLIRE_API_BASE: http://localhost:8091
          APPLIRE_E2E_COMPOSE_ARGS: -p applire-ci-auth -f docker-compose.yml -f docker-compose.ci-auth.yml
        run: |
          # The smoke step above claimed the instance; the concurrent-claim race
          # (tests/integration/test_auth_races.py) needs an UNCLAIMED stack, and a
          # claimed one fails it under CI (MD-37) — so start from a fresh volume.
          $CI_AUTH_COMPOSE down -v
          $CI_AUTH_COMPOSE up -d --no-build
          timeout 300 bash -c "until curl -sf $CI_AUTH_BASE/health >/dev/null; do sleep 3; done"
          pip install pytest requests
          pytest tests/test_auth_e2e.py tests/integration/test_auth_races.py -v --tb=short

      - name: Show logs on failure
        if: failure()
        run: $CI_AUTH_COMPOSE logs --no-color

      - name: Tear down
        if: always()
        run: $CI_AUTH_COMPOSE down -v

  frontend-unit-tests:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-test-results
          path: frontend/test-results/
          retention-days: 30

  frontend-lint:
    name: Frontend Lint (ESLint + i18n parity)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint and i18n parity check
        working-directory: frontend
        run: npm run lint

  frontend-build-check:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run production build
        working-directory: frontend
        run: npm run build
        env:
          BACKEND_URL: http://backend:8000

  module-system-check:
    name: Module System Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify ES module mode in root package.json
        run: |
          echo "Checking root package.json..."
          if ! grep -q '"type": "module"' package.json; then
            echo "❌ Root package.json must declare '\"type\": \"module\"'"
            exit 1
          fi
          echo "✅ Root package.json declares ES module mode"

      - name: Verify ES module mode in frontend package.json
        run: |
          echo "Checking frontend package.json..."
          if ! grep -q '"type": "module"' frontend/package.json; then
            echo "❌ Frontend package.json must declare '\"type\": \"module\"'"
            exit 1
          fi
          echo "✅ Frontend package.json declares ES module mode"

      - name: Check for CommonJS require() in test files
        run: |
          echo "Scanning for CommonJS require() statements in test files..."
          if grep -r "require(" tests/ frontend/ --include="*.ts" --include="*.tsx" --include="*.spec.ts" | grep -v node_modules; then
            echo "❌ Found CommonJS require() statements in test files"
            exit 1
          fi
          echo "✅ No CommonJS require() statements found"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, integration-and-e2e-tests, postgres-only-tests, real-auth-lane, frontend-unit-tests, frontend-lint, frontend-build-check, module-system-check]
    if: always()
    permissions:
      pull-requests: write
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test results
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts

      - name: Generate test summary
        if: always()
        run: |
          echo "## Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Unit Tests | ${{ needs.backend-unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration & E2E Tests | ${{ needs.integration-and-e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Postgres-only Tests | ${{ needs.postgres-only-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Real-auth Lane | ${{ needs.real-auth-lane.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Unit Tests (Vitest) | ${{ needs.frontend-unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.frontend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Production Build | ${{ needs.frontend-build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Module System Check | ${{ needs.module-system-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.backend-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-and-e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.postgres-only-tests.result }}" != "success" ] || \
             [ "${{ needs.real-auth-lane.result }}" != "success" ] || \
             [ "${{ needs.frontend-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-lint.result }}" != "success" ] || \
             [ "${{ needs.frontend-build-check.result }}" != "success" ] || \
             [ "${{ needs.module-system-check.result }}" != "success" ]; then
            echo "**Test suite failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "**All tests passed!**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const unitTestsResult = '${{ needs.backend-unit-tests.result }}';
            const integrationE2eResult = '${{ needs.integration-and-e2e-tests.result }}';
            const pgOnlyResult = '${{ needs.postgres-only-tests.result }}';
            const realAuthResult = '${{ needs.real-auth-lane.result }}';
            const frontendUnitTestsResult = '${{ needs.frontend-unit-tests.result }}';
            const frontendLintResult = '${{ needs.frontend-lint.result }}';
            const frontendBuildResult = '${{ needs.frontend-build-check.result }}';
            const moduleCheckResult = '${{ needs.module-system-check.result }}';
            const allPassed = unitTestsResult === 'success' &&
                              integrationE2eResult === 'success' &&
                              pgOnlyResult === 'success' &&
                              realAuthResult === 'success' &&
                              frontendUnitTestsResult === 'success' &&
                              frontendLintResult === 'success' &&
                              frontendBuildResult === 'success' &&
                              moduleCheckResult === 'success';
            const body = allPassed
              ? '**All tests passed!** This PR is ready to merge.'
              : [
                  '**Test failures detected**\n',
                  unitTestsResult !== 'success' ? `- Backend Unit Tests: ${unitTestsResult}` : '',
                  integrationE2eResult !== 'success' ? `- Integration & E2E Tests: ${integrationE2eResult}` : '',
                  pgOnlyResult !== 'success' ? `- Postgres-only Tests: ${pgOnlyResult}` : '',
                  realAuthResult !== 'success' ? `- Real-auth Lane: ${realAuthResult}` : '',
                  frontendUnitTestsResult !== 'success' ? `- Frontend Unit Tests (Vitest): ${frontendUnitTestsResult}` : '',
                  frontendLintResult !== 'success' ? `- Frontend Lint: ${frontendLintResult}` : '',
                  frontendBuildResult !== 'success' ? `- Frontend Production Build: ${frontendBuildResult}` : '',
                  moduleCheckResult !== 'success' ? `- Module System Check: ${moduleCheckResult}` : '',
                ].filter(Boolean).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
