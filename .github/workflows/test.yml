name: Test Suite

on:
  push:
    branches: [main]      # post-merge / direct commits to main
  pull_request:           # every PR (feature branches)

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock requests

      - name: Install Playwright Chromium (ATS round-trip renderer)
        run: python -m playwright install --with-deps chromium

      # poppler-utils supplies `pdftotext -bbox-layout`, the word-level geometry
      # probe tests/ats/test_page_geometry.py measures #621's page margins and
      # #622's break policy with. Without it those 45 tests error out (the binary
      # is absent on ubuntu-latest by default) — and a skip would be worse than a
      # failure: the whole point of the suite is that the layout claims are backed
      # by read pixels, not by reasoning about CSS.
      - name: Install poppler-utils (PDF geometry probe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      # tests/ats/test_office_export.py (E057 task 1.3, #637/#638, ADR-079
      # clause 5) converts the .docx office-export writer's output to PDF
      # with headless LibreOffice to assert the page count — a .docx has no
      # fixed pagination of its own until a word processor lays it out
      # (ADR-079 clause 4). Absent from ubuntu-latest by default, like
      # poppler-utils above, and for the same reason a skip would be worse
      # than a failure here too: the whole point of the gate is that "fits
      # the region's page norm" is backed by a real conversion, not a guess.
      # fonts-crosextra-carlito is the metric-compatible substitute Ubuntu
      # ships for Calibri (services/office_export/_common.py's base font) —
      # installing it PINS which substitution this runner's LibreOffice
      # makes, so the flip point measured on the dev host
      # (Documents/Runs/Stracciatella/office-export/2026-08-31-page-count-
      # gate-portability.md: 1->2 pages at 39 bullets on this exact
      # substitution, the tightest of three fonts measured) reproduces here
      # instead of being asserted across whatever font happens to be
      # present.
      - name: Install LibreOffice + metric-compatible fonts (docx page-count gate)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-crosextra-carlito

      - name: ATS round-trip guarantee (ADR-039)
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
        run: PYTHONPATH=backend pytest tests/ats/ -v

      - name: Run unit tests with coverage
        run: |
          PYTHONPATH=backend pytest tests/unit/ backend/tests/unit/ \
            --ignore=tests/conftest.py \
            --ignore=backend/tests/conftest.py \
            --cov=applire \
            --cov-config=backend/.coveragerc \
            --cov-report=term-missing \
            --cov-report=html:backend/htmlcov \
            --cov-fail-under=75 \
            --junitxml=backend/test-results.xml \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/htmlcov/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: backend/test-results.xml
          retention-days: 30

      - name: Publish unit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Unit Tests
          path: backend/test-results.xml
          reporter: 'java-junit'
          fail-on-error: false

  integration-and-e2e-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghclient /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock requests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Both lockfiles: this job runs `npm ci` twice (root, then frontend) and
          # the key covered only the frontend one, so a root-lockfile change
          # silently missed. Measured 2026-09-04: a cold `npm ci` costs 7.0 min in
          # a job with ~8 min of headroom.
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        run: node_modules/.bin/playwright install --with-deps chromium firefox

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The step that used to sit here cached /tmp/.buildx-cache — a path that
      # appeared exactly ONCE in the whole repository, in the cache step itself.
      # Nothing wrote to it and `docker compose up --build` never read it, so the
      # image build was cold on EVERY run: a control that could not fire. Measured
      # 2026-09-04 on a job with `timeout-minutes: 30` and ~8 min of headroom, the
      # build cost 2.9-8.6 min depending on the runner, and three consecutive runs
      # timed out during PQ with no test having failed. Replaced with a cache that
      # is actually wired to the build, via BuildKit's GitHub Actions backend.
      #
      # `docker-compose.override.yml` builds two images (backend -- shared by the
      # backend/retention/mcp services -- and frontend). They are built here with
      # the tags docker-compose.yml declares, so the `up` below finds them locally
      # and does not rebuild; `--build` is therefore dropped.
      - name: Build backend image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: ghcr.io/applire/applire-backend:latest
          load: true
          cache-from: type=gha,scope=e2e-backend
          cache-to: type=gha,mode=max,scope=e2e-backend

      - name: Build frontend image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          # `target: dev` mirrors docker-compose.override.yml exactly — the
          # frontend Dockerfile is multi-stage and the dev stack expects the dev
          # stage (hot reload, the /app/node_modules and /app/.next volumes).
          # Building the default/production stage here would start a subtly wrong
          # frontend and the E2E suites would chase the symptom, not the cause.
          target: dev
          tags: ghcr.io/applire/applire-frontend:latest
          load: true
          cache-from: type=gha,scope=e2e-frontend
          cache-to: type=gha,mode=max,scope=e2e-frontend

      - name: Create .env from CI template
        run: cp .env.ci .env

      - name: Start Docker services
        run: docker compose up -d

      - name: Wait for application to be ready
        run: |
          echo "Waiting for backend..."
          timeout 300 bash -c 'until curl -sf http://localhost:8001/health; do sleep 3; done'
          echo "Backend ready."
          echo "Waiting for frontend..."
          timeout 180 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'
          echo "Frontend ready."
          echo "Waiting for nginx (PQ tests require port 80)..."
          timeout 60 bash -c 'until curl -sf http://localhost; do sleep 2; done'
          echo "Nginx ready."

      - name: Show backend logs on startup failure
        if: failure()
        run: docker compose logs backend postgres

      - name: Run database migrations
        run: docker compose exec backend python -m alembic upgrade head

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --junitxml=integration-test-results.xml \
            -v \
            --tb=short

      - name: Run MCP stdio tests (agent channel)
        run: |
          pytest tests/test_mcp_server.py tests/test_mcp_endpoints.py tests/test_mcp_agent_journey.py \
            --junitxml=mcp-test-results.xml \
            -v \
            --tb=short

      - name: Upload MCP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-stdio-test-results
          path: mcp-test-results.xml
          retention-days: 30

      - name: Run Playwright IQ tests
        run: node_modules/.bin/playwright test tests/iq/
        env:
          CI: true

      - name: Run Playwright OQ tests (desktop)
        run: node_modules/.bin/playwright test tests/oq/ --project=chromium
        env:
          CI: true

      - name: Run Playwright OQ tests (mobile, US227)
        run: node_modules/.bin/playwright test tests/oq/mobile/ --project=mobile-chromium
        env:
          CI: true

      - name: Run Playwright PQ tests
        run: node_modules/.bin/playwright test --config=playwright.config.pq.ts
        env:
          CI: true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-results
          path: integration-test-results.xml
          retention-days: 30

      - name: Publish integration test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Integration Tests
          path: integration-test-results.xml
          reporter: 'java-junit'
          fail-on-error: false

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 30

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down Docker services
        if: always()
        run: docker compose down -v

  frontend-unit-tests:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-test-results
          path: frontend/test-results/
          retention-days: 30

  frontend-lint:
    name: Frontend Lint (ESLint + i18n parity)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint and i18n parity check
        working-directory: frontend
        run: npm run lint

  frontend-build-check:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run production build
        working-directory: frontend
        run: npm run build
        env:
          BACKEND_URL: http://backend:8000

  module-system-check:
    name: Module System Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify ES module mode in root package.json
        run: |
          echo "Checking root package.json..."
          if ! grep -q '"type": "module"' package.json; then
            echo "❌ Root package.json must declare '\"type\": \"module\"'"
            exit 1
          fi
          echo "✅ Root package.json declares ES module mode"

      - name: Verify ES module mode in frontend package.json
        run: |
          echo "Checking frontend package.json..."
          if ! grep -q '"type": "module"' frontend/package.json; then
            echo "❌ Frontend package.json must declare '\"type\": \"module\"'"
            exit 1
          fi
          echo "✅ Frontend package.json declares ES module mode"

      - name: Check for CommonJS require() in test files
        run: |
          echo "Scanning for CommonJS require() statements in test files..."
          if grep -r "require(" tests/ frontend/ --include="*.ts" --include="*.tsx" --include="*.spec.ts" | grep -v node_modules; then
            echo "❌ Found CommonJS require() statements in test files"
            exit 1
          fi
          echo "✅ No CommonJS require() statements found"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, integration-and-e2e-tests, frontend-unit-tests, frontend-lint, frontend-build-check, module-system-check]
    if: always()
    permissions:
      pull-requests: write
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test results
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts

      - name: Generate test summary
        if: always()
        run: |
          echo "## Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Unit Tests | ${{ needs.backend-unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration & E2E Tests | ${{ needs.integration-and-e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Unit Tests (Vitest) | ${{ needs.frontend-unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.frontend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Production Build | ${{ needs.frontend-build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Module System Check | ${{ needs.module-system-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.backend-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-and-e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-lint.result }}" != "success" ] || \
             [ "${{ needs.frontend-build-check.result }}" != "success" ] || \
             [ "${{ needs.module-system-check.result }}" != "success" ]; then
            echo "**Test suite failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "**All tests passed!**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const unitTestsResult = '${{ needs.backend-unit-tests.result }}';
            const integrationE2eResult = '${{ needs.integration-and-e2e-tests.result }}';
            const frontendUnitTestsResult = '${{ needs.frontend-unit-tests.result }}';
            const frontendLintResult = '${{ needs.frontend-lint.result }}';
            const frontendBuildResult = '${{ needs.frontend-build-check.result }}';
            const moduleCheckResult = '${{ needs.module-system-check.result }}';
            const allPassed = unitTestsResult === 'success' &&
                              integrationE2eResult === 'success' &&
                              frontendUnitTestsResult === 'success' &&
                              frontendLintResult === 'success' &&
                              frontendBuildResult === 'success' &&
                              moduleCheckResult === 'success';
            const body = allPassed
              ? '**All tests passed!** This PR is ready to merge.'
              : [
                  '**Test failures detected**\n',
                  unitTestsResult !== 'success' ? `- Backend Unit Tests: ${unitTestsResult}` : '',
                  integrationE2eResult !== 'success' ? `- Integration & E2E Tests: ${integrationE2eResult}` : '',
                  frontendUnitTestsResult !== 'success' ? `- Frontend Unit Tests (Vitest): ${frontendUnitTestsResult}` : '',
                  frontendLintResult !== 'success' ? `- Frontend Lint: ${frontendLintResult}` : '',
                  frontendBuildResult !== 'success' ? `- Frontend Production Build: ${frontendBuildResult}` : '',
                  moduleCheckResult !== 'success' ? `- Module System Check: ${moduleCheckResult}` : '',
                ].filter(Boolean).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
