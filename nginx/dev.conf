map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Access log without secrets (ADR-091 cl. 18; Strawberry 5a). The stock
# `combined` format logs `$request` (path AND query string) and the Referer —
# a signed document link (`?exp=&uid=&sig=`), an OIDC callback (`?code=&state=`)
# or a link-token path would land in the log verbatim. This format logs the
# method and the normalised path only (`$uri`, no arguments), never the Referer,
# and masks anything after /api/auth/links/. The backend's uvicorn access
# filter (auth/logfilter.py) redacts the same values on its side.
map $uri $applire_log_uri {
    "~^/api/auth/links/" "/api/auth/links/[redacted]";
    default              $uri;
}

log_format applire_redacted '$remote_addr - [$time_local] '
                            '"$request_method $applire_log_uri $server_protocol" '
                            '$status $body_bytes_sent "$http_user_agent" rt=$request_time';

server {
    listen 80;

    client_max_body_size 20M;

    access_log /var/log/nginx/access.log applire_redacted;

    # Re-resolve upstream container names via Docker's embedded DNS instead of
    # caching the IP at startup. Combined with the variable proxy_pass below,
    # this lets nginx pick up new backend/frontend IPs after a container is
    # recreated (e.g. a rebuild) without an nginx restart — avoids stale-upstream
    # 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The real client address (ADR-091 cl. 13 as amended by MD-33). Login
    # throttling keys on (email, client); the client is X-Real-IP below, i.e.
    # $remote_addr as nginx sees it. By default NO peer is trusted to supply
    # X-Forwarded-For: a LAN device could otherwise pick a new throttle identity
    # per attempt (adv-id-4). An operator who runs a TLS proxy in front names
    # that proxy with ONE line in .env, APPLIRE_TRUSTED_PROXY=<ip or cidr>[,…];
    # the image's entrypoint writes the matching trust directives into
    # /etc/nginx/applire/ (empty when unset; nginx refuses to start on an
    # invalid value). A bind-mounted config without the include trusts nobody.
    include /etc/nginx/applire/*.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # `Host $http_host` (not `$host`): the browser's Origin carries the port
    # (http://nas:8080), and the backend's origin check compares host AND port
    # with the Host it receives (ADR-091 cl. 12). `$host` drops the port, so
    # every login and setup on a remapped port would be refused as cross-site.

    location /api/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /static/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # Frontend — Next.js dev server including HMR websocket
    location / {
        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
