map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Access log without typed text (ADR-091 cl. 18; ADR-087 cl. 9 amended
# 2026-11-18). The stock `combined` format logs `$request` (path AND query
# string) and the Referer: a signed document link, an OIDC callback, a page
# address or a mistyped path would land in the log verbatim. This format logs
# the method, the status and the API area or page only: the first path segment
# when it is on the closed lists below, "/[...]" when the path goes on, and
# "[other]" for any other path. Never the rest of the path, the query string or
# the Referer. The backend's own access log shows the matched route
# (auth/logfilter.py). tests/unit/test_nginx_error_log_level.py keeps the lists
# equal to the backend's route table and the frontend's pages.
map $uri $applire_log_uri {
    "/"                                                       "/";
    "~^/api/(?<applire_area>admin|applications|auth|color-schemes|cover-letter|cv|documents|flow|job|jobs|me|ops|profile|session|settings|setup)$"     "/api/$applire_area";
    "~^/api/(?<applire_area_more>admin|applications|auth|color-schemes|cover-letter|cv|documents|flow|job|jobs|me|ops|profile|session|settings|setup)/"     "/api/$applire_area_more/[...]";
    "~^/(?<applire_page>admin|applications|dashboard|documents|flow|profile|settings|forgot|invite|log-consent|login|reset|setup|share-target|health|docs|redoc|_next|icons|static|openapi\.json|manifest\.webmanifest|icon\.png|favicon\.ico|sw\.js|offline\.html|applire-icon\.png)$"     "/$applire_page";
    "~^/(?<applire_page_more>admin|applications|dashboard|documents|flow|profile|settings|forgot|invite|log-consent|login|reset|setup|share-target|health|docs|redoc|_next|icons|static)/"     "/$applire_page_more/[...]";
    default                                                   "[other]";
}

log_format applire_redacted '$remote_addr - [$time_local] '
                            '"$request_method $applire_log_uri $server_protocol" '
                            '$status $body_bytes_sent "$http_user_agent" rt=$request_time';

server {
    listen 80;

    client_max_body_size 20M;

    access_log /var/log/nginx/access.log applire_redacted;

    # Re-resolve upstream container names via Docker's embedded DNS instead of
    # caching the IP at startup. Combined with the variable proxy_pass below,
    # this lets nginx pick up new backend/frontend IPs after a container is
    # recreated (e.g. a rebuild) without an nginx restart — avoids stale-upstream
    # 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The real client address (ADR-091 cl. 13 as amended by MD-33). Login
    # throttling keys on (email, client); the client is X-Real-IP below, i.e.
    # $remote_addr as nginx sees it. By default NO peer is trusted to supply
    # X-Forwarded-For: a LAN device could otherwise pick a new throttle identity
    # per attempt (adv-id-4). An operator who runs a TLS proxy in front names
    # that proxy with ONE line in .env, APPLIRE_TRUSTED_PROXY=<ip or cidr>[,…];
    # the image's entrypoint writes the matching trust directives into
    # /etc/nginx/applire/ (empty when unset; nginx refuses to start on an
    # invalid value). A bind-mounted config without the include trusts nobody.
    include /etc/nginx/applire/*.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # `Host $http_host` (not `$host`): the browser's Origin carries the port
    # (http://nas:8080), and the backend's origin check compares host AND port
    # with the Host it receives (ADR-091 cl. 12). `$host` drops the port, so
    # every login and setup on a remapped port would be refused as cross-site.

    location /api/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /static/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # Frontend — Next.js dev server including HMR websocket
    location / {
        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
