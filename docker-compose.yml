# Self-hosted Applire — pulls pre-built images from GHCR.
#
# Quick start (no git clone required — every service is a pre-built image).
# Fetch both files from the newest RELEASE, not from main: the images below are
# :latest, and main runs ahead of the released image for most of a flavour, so a
# compose file taken from main can reference settings the running image rejects.
#   curl -LO https://github.com/Applire/Applire/releases/latest/download/docker-compose.yml
#   curl -L -o .env.example https://github.com/Applire/Applire/releases/latest/download/env.example
#   cp .env.example .env        # set LLM_PROVIDER and matching API key
#   docker compose up -d        # migrations run automatically on backend startup
#
# The reverse proxy config is baked into the applire-nginx image (ADR-033), so there
# is no nginx config to fetch or mount. To update: docker compose pull && up -d.

# Bounded container logs — without rotation the docker json-file driver grows
# without limit and can fill the host disk (which takes PostgreSQL down with it).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: applire
      POSTGRES_PASSWORD: applire
      POSTGRES_DB: applire
    # No host port: the database is reachable only on the internal compose network.
    # The dev override publishes 5433 for local tooling.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Relaxed steady-state interval keeps healthcheck churn low: every probe forks a
    # `docker exec`/`runc init` that briefly pegs a core, so a 5s cadence across the
    # stack shows up as constant CPU spikes. start_interval keeps cold-start detection
    # fast (probes every 2s during start_period) so `backend` isn't held back waiting
    # for postgres. Requires Docker Engine 25+ (start_interval).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applire"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  backend:
    image: ghcr.io/applire/applire-backend:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+asyncpg://applire:applire@postgres:5432/applire
    env_file:
      - path: .env
        required: false
    expose:
      - "8000"
    # User files (CV uploads, profile photos) live under /app/data/uploads and must
    # survive image updates — the volume is deliberately scoped to the uploads dir,
    # NOT /app/data: data/static ships read-only release content (templates) inside
    # the image and must not be shadowed by stale volume state.
    volumes:
      - applire_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # start_period covers the alembic migrations that run at boot; curl is not
    # guaranteed in the image, so the probe uses the Python stdlib. start_interval
    # probes every 3s during that window so frontend/nginx start promptly once
    # migrations finish; the 30s steady-state interval keeps post-boot churn low.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 3s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ghcr.io/applire/applire-frontend:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      BACKEND_URL: http://backend:8000
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  # Reverse proxy — routes /api,/health,/static → backend and everything else →
  # frontend. The config is baked into the image (ADR-033), so nothing is mounted
  # from the host; a self-hoster who wants a custom domain/TLS can still bind-mount
  # their own file over /etc/nginx/conf.d/default.conf.
  nginx:
    image: ghcr.io/applire/applire-nginx:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  ollama:
    image: ollama/ollama
    profiles: [ollama]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Retention worker — daily GDPR TTL enforcement (ADR 005).
  # Shares the uploads volume with the backend: TTL enforcement deletes the expired
  # upload FILES too (storage.delete), which silently no-ops without shared storage.
  retention:
    image: ghcr.io/applire/applire-backend:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+asyncpg://applire:applire@postgres:5432/applire
    env_file:
      - path: .env
        required: false
    volumes:
      - applire_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "while true; do python -m applire.retention; sleep 86400; done"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # MCP server — stdio transport for agent integration (ADR 010).
  # For actual agent use, launch directly: python -m applire.mcp
  # See the README (Model Context Protocol section) for Claude Desktop / Cursor configuration.
  # No restart policy on purpose: an interactive stdio process, opt-in via profile.
  mcp:
    image: ghcr.io/applire/applire-backend:latest
    profiles: [mcp]
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+asyncpg://applire:applire@postgres:5432/applire
    env_file:
      - path: .env
        required: false
    volumes:
      - applire_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m applire.mcp
    stdin_open: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  ollama_data:
  applire_uploads:
